services:

  db:
    image: postgres:16
    container_name: delivery-db
    restart: unless-stopped
    environment:
        POSTGRES_DB: delivery_db
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  delivery-app:
    build:
      context: ./delivery_project
    container_name: delivery-app
    restart: unless-stopped
    command: >
      sh -c "
      python manage.py migrate &&
      python seed.py &&
      python manage.py runserver 0.0.0.0:8000
      "

    volumes:
      - ./delivery_project:/app/delivery_project

    ports:
      - "8000:8000"

    env_file:
      - .env

    depends_on:
      db:
        condition: service_healthy
  
  product-db:
    image: postgres:16
    container_name: product-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: product_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5433:5432"

    volumes:
      - product_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    
  product-service:
    build:
      context: ./product_service

    container_name: product-service
    restart: unless-stopped
    command: >
      sh -c "
      python manage.py migrate &&
      python manage.py runserver 0.0.0.0:8001
      "

    volumes:
      - ./product_service:/app

    ports:
      - "8001:8001"

    env_file:
      - ./product_service/.env

    depends_on:
      product-db:
        condition: service_healthy
  
  order-db:
    image: postgres:16
    container_name: order-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: order_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5434:5432"

    volumes:
      - order_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  order-service:
    build:
      context: ./order_service

    container_name: order-service
    restart: unless-stopped

    command: >
      sh -c "
      python manage.py migrate &&
      python manage.py runserver 0.0.0.0:8002
      "

    volumes:
      - ./order_service:/app

    ports:
      - "8002:8002"

    env_file:
      - ./order_service/.env

    depends_on:
      order-db:
        condition: service_healthy
  
  account-db:
    image: postgres:16
    container_name: account-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: account_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5435:5432"

    volumes:
      - account_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
  
  account-service:
    build:
      context: ./account_service

    container_name: account-service
    restart: unless-stopped

    command: >
      sh -c "
      python manage.py migrate &&
      python manage.py runserver 0.0.0.0:8003
      "

    volumes:
      - ./account_service:/app

    ports:
      - "8003:8003"

    env_file:
      - ./account_service/.env

    depends_on:
      account-db:
        condition: service_healthy

volumes:
  postgres_data:
  product_data:
  order_data:
  account_data: