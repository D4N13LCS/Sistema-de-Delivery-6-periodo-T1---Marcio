{% extends 'core/base.html' %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-lg-5">

        <div class="card card-custom p-5">

            <h2 class="mb-4 text-center">
                Login
            </h2>
            {% if erro %}

                <div class="alert alert-danger">

                    {{ erro }}

                </div>

            {% endif %}

            <form method="POST">

                {% csrf_token %}

                <input
                    type="text"
                    name="username"
                    class="form-control mb-3"
                    placeholder="Usuário">

                <input
                    type="password"
                    name="password"
                    class="form-control mb-4"
                    placeholder="Senha">

                <button
                    class="btn btn-dark w-100">

                    Entrar

                </button>

            </form>

            <div class="text-center mt-4">

                <a href="/register/">

                    Criar conta

                </a>

            </div>

        </div>

    </div>

</div>

{% endblock %}
