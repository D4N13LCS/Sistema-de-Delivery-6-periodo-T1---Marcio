{% extends 'core/base.html' %}

{% block content %}

<div class="card card-custom p-5">

    <h1 class="mb-4">

        Minha Conta

    </h1>

    <form method="POST">

        {% csrf_token %}

        <label>
            Usuário
        </label>

        <input
            type="text"
            class="form-control mb-3"
            value="{{ user.username }}"
            disabled>

        <label>
            Endereço
        </label>

        <input
            type="text"
            name="endereco"
            class="form-control mb-3"
            value="{{ perfil.endereco|default:'' }}">

        <hr class="my-4">

        <h4 class="mb-3">

            Cartão

        </h4>

        <label>
            Número do cartão
        </label>

        <input
            type="text"
            name="numero_cartao"
            class="form-control mb-3"
            value="{{ perfil.numero_cartao|default:'' }}">

        <label>
            Nome impresso
        </label>

        <input
            type="text"
            name="nome_cartao"
            class="form-control mb-3"
            value="{{ perfil.nome_cartao|default:'' }}">

        <label>
            Validade
        </label>

        <input
            type="text"
            name="validade_cartao"
            class="form-control mb-4"
            placeholder="12/30"
            value="{{ perfil.validade_cartao|default:'' }}">

        <button class="btn btn-dark">

            Salvar Informações

        </button>

    </form>

</div>

{% endblock %}
