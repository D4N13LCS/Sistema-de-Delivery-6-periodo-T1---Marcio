{% extends 'core/base.html' %}

{% block content %}

<div class="card card-custom p-5">

    <h1 class="mb-4">

        Minha Conta

    </h1>

    <form method="POST">

        {% csrf_token %}

        <label>
            Usuário
        </label>

        <input
            type="text"
            class="form-control mb-3"
            value="{{ user.username }}"
            disabled>

        <label>
            Endereço
        </label>

        <input
            type="text"
            name="address"
            class="form-control mb-3"
            value="{{ profile.address|default:'' }}">

        <hr class="my-4">

        <h4 class="mb-3">

            Cartão

        </h4>

        <label>
            Número do cartão
        </label>

        <input
            type="text"
            name="card_number"
            class="form-control mb-3"
            value="{{ profile.card_number|default:'' }}">

        <label>
            Nome impresso
        </label>

        <input
            type="text"
            name="card_name"
            class="form-control mb-3"
            value="{{ profile.card_name|default:'' }}">

        <label>
            Validade
        </label>

        <input
            type="text"
            name="card_expiration"
            class="form-control mb-4"
            placeholder="12/30"
            value="{{ profile.card_expiration|default:'' }}">

        <button class="btn btn-dark">

            Salvar Informações

        </button>

    </form>

</div>

{% endblock %}
