{% extends 'core/base.html' %}

{% block content %}

<div class="text-center mb-5">

    <h1 class="title-main display-5">
        Nosso Cardápio
    </h1>

    <p class="text-muted">
        Escolha seu lanche favorito
    </p>

</div>

<div class="row g-4">

    {% for produto in produtos %}

    <div class="col-md-4">

    <div class="card card-custom h-100">

        <div class="produto-img-container">

            <img
                src="{{ produto.imagem }}"
                class="produto-img"
                alt="{{ produto.nome }}">

        </div>

        <div class="card-body">

            <h3>
                {{ produto.nome }}
            </h3>

            <p class="text-muted">

                {{ produto.descricao }}

            </p>

            <h4 class="mt-3">

                R$ {{ produto.preco }}

            </h4>

        </div>

    </div>

</div>

    {% endfor %}

</div>

{% endblock %}
